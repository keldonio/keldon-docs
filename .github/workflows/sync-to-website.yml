name: Sync docs to keldon-website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-docs-to-website
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout keldon-docs
        uses: actions/checkout@v4
        with:
          path: docs-source

      - name: Checkout keldon-website
        uses: actions/checkout@v4
        with:
          repository: keldonio/keldon-website
          token: ${{ secrets.KELDON_WEBSITE_TOKEN }}
          path: website
          ref: main

      - name: Configure git
        run: |
          cd website
          git config user.name "keldon-content-sync"
          git config user.email "actions@users.noreply.github.com"

      - name: Sync versioned docs
        run: |
          # Sync each version folder found in the repo root
          # Existing versions on the website that are NOT in this repo are left untouched
          for version_dir in docs-source/v*/; do
            version=$(basename "$version_dir")
            echo "Syncing $version..."

            mkdir -p "website/content/docs/$version"

            rsync -av --delete \
              "$version_dir" "website/content/docs/$version/"
          done

      - name: Commit and push if changed
        run: |
          cd website
          git add -A content/docs/

          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          # List which versions were synced for the commit message
          versions=$(ls docs-source | grep '^v' | tr '\n' ' ')
          git commit -m "chore(sync): update docs [${versions% }] from keldon-docs@${{ github.sha }}"
          git push origin main
